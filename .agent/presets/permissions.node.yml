# VibeDiscipline permission policy — source of truth. Preset: Node.js / TypeScript.
# Compiled by scripts/compile-permissions.cjs into:
#   .claude/settings.json  ·  .githooks/pre-commit and pre-push  ·  docs/PERMISSIONS.md
# Do not hand-edit the generated targets — edit this file and recompile.
# This is a starting point: add your project's own commands and paths.

version: 1
# auto: allow-list runs freely, confirm-list prompts. guided: every command
# and write prompts. strict: reads prompt too. Deny wins in every mode.
mode: auto        # auto | guided | strict

commands:
  allow:
    - "git status"
    - "git diff*"
    - "git log*"
    - "git branch*"
    - "git show*"
    - "npm test*"
    - "npm run test*"
    - "npm run lint*"
    - "npm run typecheck*"
    - "npm run build*"
    - "pnpm test*"
    - "pnpm lint*"
    - "pnpm typecheck*"
    - "pnpm build*"
    - "yarn test*"
    - "yarn lint*"
    - "yarn build*"
    - "npx tsc --noEmit*"
    - "npx eslint*"
    - "npx prettier --check*"
    - "npx vitest run*"
    - "npx jest*"
    - "node --test*"

  confirm:
    - "npm install *"
    - "npm uninstall *"
    - "npm update*"
    - "npm publish*"
    - "pnpm add *"
    - "pnpm remove *"
    - "pnpm update*"
    - "yarn add *"
    - "yarn remove *"
    - "npx prisma migrate*"
    - "npx prisma db push*"
    - "npx drizzle-kit push*"
    - "git push*"
    - "git rebase*"
    - "git merge*"
    - "docker*"
    - "*deploy*"

  deny:
    - "git push --force*"
    - "git push -f*"
    - "git reset --hard*"
    - "git clean -fd*"
    - "rm -rf *"
    - "npx prisma migrate reset*"
    - "npx prisma db push --force-reset*"
    - "*DROP DATABASE*"
    - "*DROP TABLE*"
    - "*TRUNCATE*"
    - "curl * | sh"
    - "curl * | bash"
    - "chmod 777*"
    - "*--no-verify*"

files:
  allow:
    - "src/**"
    - "app/**"
    - "pages/**"
    - "components/**"
    - "lib/**"
    - "public/**"
    - "tests/**"
    - "test/**"
    - "__tests__/**"
    - "docs/**"

  confirm:
    - ".env*"
    - "package.json"
    - "package-lock.json"
    - "pnpm-lock.yaml"
    - "yarn.lock"
    - "tsconfig*.json"
    - "next.config.*"
    - "vite.config.*"
    - "prisma/schema.prisma"
    - "prisma/migrations/**"
    - "drizzle/**"
    - "docker-compose*.yml"
    - "Dockerfile*"
    - ".github/workflows/**"

  deny:
    - ".git/**"
    - "**/*.pem"
    - "**/*.key"
    - "**/*.p12"
    - "**/id_rsa*"
    - "**/.ssh/**"

network:
  allow: ["read-only fetch of public documentation"]
  confirm: ["any request that mutates external state"]
  deny: ["sending repository contents to third-party services"]

escalation:
  on_deny: >
    Stop. Explain what was attempted, why it is denied, and what the
    human can do instead. Never attempt an equivalent workaround.
  on_confirm_timeout: stop
  approval_scope: single-invocation
