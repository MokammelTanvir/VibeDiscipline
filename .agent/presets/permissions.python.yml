# VibeDiscipline permission policy — source of truth. Preset: Python.
# Compiled by scripts/compile-permissions.cjs into:
#   .claude/settings.json  ·  .githooks/pre-commit and pre-push  ·  docs/PERMISSIONS.md
# Do not hand-edit the generated targets — edit this file and recompile.
# This is a starting point: add your project's own commands and paths.

version: 1
# auto: allow-list runs freely, confirm-list prompts. guided: every command
# and write prompts. strict: reads prompt too. Deny wins in every mode.
mode: auto        # auto | guided | strict

commands:
  allow:
    - "git status"
    - "git diff*"
    - "git log*"
    - "git branch*"
    - "git show*"
    - "pytest*"
    - "python -m pytest*"
    - "uv run pytest*"
    - "poetry run pytest*"
    - "ruff check*"
    - "ruff format --check*"
    - "mypy*"
    - "pyright*"
    - "python manage.py test*"
    - "python manage.py check*"
    - "python manage.py showmigrations*"

  confirm:
    - "pip install *"
    - "pip uninstall *"
    - "uv add *"
    - "uv remove *"
    - "uv sync*"
    - "poetry add *"
    - "poetry remove *"
    - "poetry update*"
    - "python manage.py migrate*"
    - "python manage.py makemigrations*"
    - "alembic upgrade*"
    - "alembic revision*"
    - "git push*"
    - "git rebase*"
    - "git merge*"
    - "docker*"
    - "*deploy*"

  deny:
    - "git push --force*"
    - "git push -f*"
    - "git reset --hard*"
    - "git clean -fd*"
    - "rm -rf *"
    - "python manage.py flush*"
    - "python manage.py sqlflush*"
    - "alembic downgrade base*"
    - "*DROP DATABASE*"
    - "*DROP TABLE*"
    - "*TRUNCATE*"
    - "curl * | sh"
    - "curl * | bash"
    - "chmod 777*"
    - "*--no-verify*"

files:
  allow:
    - "src/**"
    - "app/**"
    - "tests/**"
    - "docs/**"

  confirm:
    - ".env*"
    - "pyproject.toml"
    - "requirements*.txt"
    - "uv.lock"
    - "poetry.lock"
    - "Pipfile*"
    - "setup.py"
    - "setup.cfg"
    - "**/migrations/**"
    - "alembic/**"
    - "alembic.ini"
    - "**/settings.py"
    - "docker-compose*.yml"
    - "Dockerfile*"
    - ".github/workflows/**"

  deny:
    - ".git/**"
    - "**/*.pem"
    - "**/*.key"
    - "**/*.p12"
    - "**/id_rsa*"
    - "**/.ssh/**"

network:
  allow: ["read-only fetch of public documentation"]
  confirm: ["any request that mutates external state"]
  deny: ["sending repository contents to third-party services"]

escalation:
  on_deny: >
    Stop. Explain what was attempted, why it is denied, and what the
    human can do instead. Never attempt an equivalent workaround.
  on_confirm_timeout: stop
  approval_scope: single-invocation
